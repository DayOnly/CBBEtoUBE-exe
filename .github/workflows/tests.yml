name: tests

on:
  push:
    # Contributor lanes included: work happens on a lane for days before it
    # becomes a PR, and without this the first CI signal arrives at review time
    # -- which is the most expensive moment to learn something is broken.
    branches: [main, testing, 'mari/**']
  pull_request:
  workflow_dispatch:

# A second push to the same branch cancels the first — no point paying for a run
# whose result is already stale.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default. Without this block the job inherits the repository's
# default token scope, so a change to that default -- or a new workflow copied
# from this one -- would silently hold a write token on a public repository.
# #workflow-hardening
permissions:
  contents: read

jobs:
  pytest:
    # Windows only, and not for portability's sake: `.pynifly/NiflyDLL.dll` is a
    # compiled Windows DLL, so the NIF layer cannot load anywhere else.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 leads because it is the PRODUCTION runtime, not a legacy floor:
        # the shipped exe is frozen from a 3.10 interpreter
        # (dist/CBBEtoUBE/_internal/python310.dll). Note pip resolves older
        # numpy/scipy on 3.10 (numpy 2.3+ and scipy 1.16+ dropped it) -- that is
        # a feature here, since it is closer to what the frozen build bundles
        # than the newest wheels are. Drop 3.10 only when the exe build moves.
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # pyflakes is a TEST dependency, not a runtime one, so it sits here
          # rather than in requirements.txt -- but it is not optional:
          # tests/test_no_undefined_names.py shells out to it for every module
          # in src/. Without it `python -m pyflakes` exits 1 with empty stdout,
          # every one of those sweeps passes on NOTHING, and only that file's
          # own catches-a-defect control notices. vulture is pinned for the same
          # reason (tests/test_no_dead_code.py shells out to it) and because its
          # confidence scores move between releases.
          # The 3.10 lane installs the BUILD lock, pinned and hashed: 3.10 is the
          # production runtime, so it is the lane whose libraries must be the
          # ones inside the exe. The other lanes stay on requirements.txt, which
          # is what a contributor without the build toolchain installs.
          # #build-lock
          if ("${{ matrix.python-version }}" -eq "3.10") {
            pip install --require-hashes -r requirements-build.lock
          } else {
            pip install -r requirements.txt
          }
          pip install pytest pyflakes vulture==2.16

      - name: Verify pynifly loads
        # The vendored DLL is the one dependency pip cannot supply. If it fails
        # to load, most of the suite fails in a confusing way — surface it here.
        run: python -c "import sys; sys.path.insert(0, '.pynifly'); from pyn import pynifly; print('pynifly OK')"

      - name: Run tests
        run: python -m pytest -q
