# The toolchain every release is built from. scripts/build_exe.ps1 creates
# .venv-build from this file with `pip install --require-hashes` and refuses to
# build once that environment stops matching it; CI's 3.10 lane installs it too.
#
# WHY PINS AND HASHES. requirements.txt asked for numpy>=1.24, scipy>=1.10 and
# lz4>=4.0, and the build script installed "the latest PyInstaller" when it was
# missing, so nothing recorded which libraries produced a release -- and a
# different numpy or scipy is a geometry change until a parity run says
# otherwise. scipy ships no dist-info in the bundle, so this file is the only
# record of the version inside the exe.
#
# These are the versions the shipped 1.4.1 bundle carries: numpy, lz4 and
# setuptools verified against dist/CBBEtoUBE/_internal/*.dist-info, scipy and
# PyInstaller against the build stamp. To move the toolchain, edit a version and
# its hash, delete .venv-build, rebuild, and re-run the parity harness.
#
